[workspace]
members = [ "squiggle" ]

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
no_effect_underscore_binding = "allow"

[package]
name = "footy-alerts"
version = "0.1.0"
edition = "2021"

[dependencies]
squiggle = { path = "squiggle" }

axum = "0.7.9"
axum-auth = { version = "0.7.0", features = ["auth-bearer"] }
base64 = "0.22.1"
chrono = "0.4.39"
chrono-tz = "0.10.0"
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.30"
http = "1.2.0"
sentry = { version = "0.35.0", features = ["default", "tracing", "tower", "tower-http"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
thiserror = "2.0.7"
tokio = { version = "1.42.0", features = ["macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["tracing", "trace", "cors", "compression-full", "request-id", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3"}
urlencoding = "2.1"
web-push = "0.10.2"

[dev-dependencies]
httptest = "0.16.1"
